<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153e50"><link rel="manifest" href="/static/manifest.json"><title>Spese di coppia</title>
<style>
:root{--navy:#153e50;--teal:#226b68;--mint:#dff3e9;--pink:#f6e5ef;--blue:#e7eff9;--orange:#f7e8dc;--ink:#193642;--muted:#687b84;--bg:#f4f7f8;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:650px;margin:0 auto;padding:22px 0 28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted);font-weight:700}.title{font-size:30px;letter-spacing:-.04em;margin:5px 0 0;font-weight:750}.mark{width:48px;height:48px;border-radius:16px;background:var(--mint);display:grid;place-items:center;font-size:23px}
.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 8px 28px #153e500c}.field{margin-bottom:18px}.label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin:0 0 9px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid #e1e8eb;background:#f8fafb;border-radius:13px;padding:14px 8px;font-size:15px;font-weight:650;color:var(--ink)}.choice.active{background:var(--blue);border:2px solid #7da6d8;padding:13px 7px;color:#204d80}
select,input{width:100%;border:1px solid #e0e8eb;background:#f8fafb;border-radius:13px;padding:15px 14px;font-size:17px;color:var(--ink);outline-color:#7da6d8;min-height:54px}
.amountwrap{position:relative}.euro{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted);font-weight:600}.amount{padding-left:43px;font-size:26px;font-weight:650;letter-spacing:-.02em}
.submit{width:100%;border:0;background:var(--teal);color:white;border-radius:15px;padding:17px;font-size:16px;font-weight:750;letter-spacing:.02em;box-shadow:0 5px 12px #226b6825;margin-top:3px}.submit:active{transform:scale(.99)}.message{display:none;margin-top:14px;padding:13px 15px;border-radius:13px;font-size:14px;line-height:1.4}.ok{background:#e3f5e9;color:#21643b}.err{background:#fff0ed;color:#963b2e}.foot{text-align:center;color:#829198;font-size:12px;padding:16px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}#login .box{max-width:360px;width:100%;background:white;border-radius:24px;padding:25px;text-align:center}#login h2{margin:5px 0 8px}#login p{color:var(--muted);font-size:14px}#pin{font-size:24px;text-align:center;letter-spacing:.3em}
@media(min-width:600px){main{padding-top:40px}.panel{padding:28px}.title{font-size:34px}}
</style></head><body>
<div id="login"><div class="box"><div class="mark" style="margin:0 auto 14px">🔐</div><h2>Spese di coppia</h2><p>Inserisci il PIN per continuare</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="••••" aria-label="PIN"><button class="submit" id="loginBtn" style="margin-top:12px">ACCEDI</button><div id="loginMsg" class="message err"></div></div></div>
<main><header class="top"><div><div class="eyebrow">BILANCIO CONDIVISO</div><h1 class="title">Nuova spesa</h1></div><div class="mark">€</div></header>
<section class="panel"><form id="form">
<div class="field"><label class="label">CHI HA PAGATO?</label><div class="seg" id="users"><button type="button" class="choice" data-v="GIULIA">Giulia</button><button type="button" class="choice" data-v="LORENZO">Lorenzo</button></div></div>

<div class="field"><label class="label" for="mese">MESE</label><select id="mese" required><option value="">Seleziona il mese</option><option>GENNAIO</option><option>FEBBRAIO</option><option>MARZO</option><option>APRILE</option><option>MAGGIO</option><option>GIUGNO</option><option>LUGLIO</option><option>AGOSTO</option><option>SETTEMBRE</option><option>OTTOBRE</option><option>NOVEMBRE</option><option>DICEMBRE</option></select></div>

<div class="field"><label class="label" for="
<div class="field"><label class="label" for="categoria">CATEGORIA</label><select id="categoria" required><option value="">Seleziona la categoria</option><option>ALLOGGIO</option><option>ALIMENTARE</option><option>TRASPORTI</option><option>CURA PERSONALE</option><option>SVAGO_ALTRO</option></select></div>


<div class="field"><label class="label" for="distinta">DISTINTA / DESCRIZIONE</label><input id="distinta" type="text" maxlength="80" placeholder="Es. spesa Conad, benzina, affitto" required></div>\n<div class="field"><label class="label" for="importo">IMPORTO</label><div class="amountwrap"><span class="euro">€</span><input class="amount" id="importo" type="number" min="0.01" step="0.01" placeholder="0,00" required></div></div>
<button class="submit" type="submit">＋　REGISTRA SPESA</button></form><div id="message" class="message"></div></section>
<div class="foot">Stipendi e riepiloghi restano nel tuo Excel.</div></main>
<script>
let selected="";
const login=document.querySelector("#login"),msg=document.querySelector("#message");
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{selected=b.dataset.v;document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("active",x===b))}));

document.querySelector("#loginBtn").onclick=()=>{if(document.querySelector("#pin").value==="1234"){login.style.display="none";document.querySelector("#loginMsg").style.display="none"}else{let lm=document.querySelector("#loginMsg");lm.textContent="PIN errato";lm.style.display="block"}};


document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();if(!selected){show("Seleziona chi ha pagato.",false);return}let d={utente:selected,mese:document.querySelector("#mese").value,categoria:document.querySelector("#categoria").value,distinta:document.querySelector("#distinta").value.trim(),importo:document.querySelector("#importo").value};try{let spese=JSON.parse(localStorage.getItem("spese_coppia")||"[]");spese.push({...d,id:Date.now()});localStorage.setItem("spese_coppia",JSON.stringify(spese));show("Spesa salvata correttamente!",true);document.querySelector("#importo").value="";document.querySelector("#distinta").value="";document.querySelector("#importo").focus()}catch{show("Errore nel salvataggio sul dispositivo.",false)}});

function show(t,ok){msg.textContent=t;msg.className="message "+(ok?"ok":"err");msg.style.display="block"}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/static/sw.js");
</script></body></html>
